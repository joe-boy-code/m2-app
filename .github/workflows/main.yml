name: Jenga Android APK Safi

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Shusha Kodi ya m2
      uses: actions/checkout@v4

    - name: Weka Node.js Mpya Kabisa (Toleo la 24)
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Sakinisha Maktaba na Capacitor
      run: |
        npm install
        npm install -g @capacitor/cli @capacitor/core @capacitor/android

    - name: Jenga faili la App ya Simu
      run: |
        npx cap init m2 com.malekela.m2 --web-dir=.
        npx cap add android
        if [ -d "android" ]; then
          cd android && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../m2-burudani.apk || true
        fi

    - name: Hifadhi File la APK kwa Upakuzi
      uses: actions/upload-artifact@v4
      with:
        name: m2-Android-App
        path: ./*.apk
ame: Tengeneza App ya Android (.APK)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kushusha Kodi Kutoka GitHub
      uses: actions/checkout@v4

    - name: Kuweka Mfumo wa Node.js
      uses: actions/setup-node@v4
      with:
        node-node-version: 20

    - name: Kusakinisha Zana za Ndani
      run: npm install

    - name: Kutengeneza File la Android (.APK) Rasmi
      run: |
        npm install -g @electron-forge/cli
        npx electron-forge import
        echo "Injini ya Cloud inatengeneza file la .APK la m2 hapa..."
