<!DOCTYPE html>
<html>
<head>
    <title>m2 - Me to Malekela Entertainment</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 30px; background-color: #f4f6f9; color: #212529; padding-bottom: 110px; margin: 0; }
        h1, h2, h3 { color: #007bff; }
        .logo-text { font-size: 32px; font-weight: 900; color: #007bff; letter-spacing: -1px; }
        .logo-sub { font-size: 14px; color: #28a745; font-weight: bold; margin-top: -5px; margin-bottom: 20px; }
        .btn { padding: 10px 20px; margin-right: 10px; cursor: pointer; border: none; border-radius: 5px; background-color: #007bff; color: white; font-weight: bold; }
        .btn:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; }
        .btn-small { padding: 6px 12px; font-size: 12px; margin-top: 5px; border-radius: 4px; }
        .btn-watch { background-color: #ffc107; color: #212529; }
        .btn-watch:hover { background-color: #e0a800; }
        
        .profile-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; display: flex; gap: 30px; align-items: center; border-left: 5px solid #007bff; }
        .stat-box { text-align: center; background: #f8f9fa; padding: 12px 25px; border-radius: 8px; }
        .stat-num { font-size: 22px; font-weight: bold; color: #007bff; }

        .search-box { width: 100%; max-width: 500px; padding: 12px 20px; border-radius: 25px; border: 2px solid #dee2e6; font-size: 16px; margin-bottom: 25px; outline: none; }
        
        .chati-container { margin-top: 25px; }
        .chati-item { padding: 25px; margin-bottom: 25px; border-radius: 12px; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 15px; }
        .row-juu { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .video-title { font-weight: bold; font-size: 20px; }
        .video-desc { background: #f8f9fa; padding: 12px 15px; border-radius: 6px; font-size: 14px; color: #495057; border-left: 4px solid #007bff; }
        .interaction-bar { display: flex; gap: 20px; align-items: center; border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 12px 0; }
        .actions-eneo { display: flex; gap: 10px; }

        .player-box { width: 100%; max-width: 600px; display: none; margin-top: 10px; border-radius: 8px; overflow: hidden; border: 2px solid #007bff; }
        video { width: 100%; display: block; }

        .tangazo-banner { position: fixed; bottom: 0; left: 0; width: 100%; height: 90px; background-color: #222; color: #fff; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px; border-top: 2px solid #007bff; z-index: 9999; }
    </style>
</head>
<body>

    <!-- BRAND LOGO YA M2 -->
    <div style="margin-bottom: 20px;">
        <span class="logo-text">m2</span>
        <div class="logo-sub">Me to Malekela • Burudani ya Uhakika</div>
    </div>

    <div class="profile-card">
        <div>
            <h2 style="margin: 0;">Maundhui ya: <span style="color: #007bff;">Joel Danstan Malekela</span></h2>
            <p style="margin: 5px 0 0 0; color: #6c757d;">Verified Creator • m2 Admin Platform</p>
        </div>
        <div class="stat-box" style="margin-left: auto;">
            <div style="font-size: 13px;">Subscribers</div>
            <div class="stat-num">1,240</div>
        </div>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="Tafuta burudani ndani ya m2...">

    <div class="chati-container" id="chatiEneo"></div>

    <div class="tangazo-banner">📢 BANNER ADS ACTIVE ON m2 PLATFORM (EARNINGS ACTIVE)...</div>

    <script>
        let videoDataKutokaServer = [];

        window.onload = function() {
            if (window.stavifaAPI) {
                window.stavifaAPI.ombaData();
                window.stavifaAPI.pokyaData((data) => {
                    videoDataKutokaServer = data;
                    jengaChatiUpya();
                });
            }
        };

        function chezaVideoHalisi(id, url) {
            const playerBox = document.getElementById(`player-box-${id}`);
            const videoElement = document.getElementById(`video-${id}`);
            
            let zote = document.getElementsByClassName('player-box');
            for(let i=0; i<zote.length; i++) { zote[i].style.display = 'none'; }
            
            playerBox.style.display = 'block';
            videoElement.src = url;
            videoElement.play();
        }

        function jengaChatiUpya() {
            const chatiEneo = document.getElementById('chatiEneo');
            chatiEneo.innerHTML = ""; 

            videoDataKutokaServer.forEach(vid => {
                const icon = vid.kundi === "Football" ? "⚽" : vid.kundi === "Boxing" ? "🥊" : "🎵";
                
                chatiEneo.innerHTML += `
                    <div class="chati-item">
                        <div class="row-juu">
                            <span class="video-title">${icon} ${vid.nafasi}. ${vid.jinaSwa}</span>
                            <div class="actions-eneo">
                                <button class="btn btn-small btn-watch" onclick="chezaVideoHalisi(${vid.id}, '${vid.videoUrl}')">👁️ Angalia (Watch)</button>
                                <button class="btn btn-small btn-success" onclick="alert('Inapakua faili hili salama kutoka m2 servers...')">📥 Pakua</button>
                            </div>
                        </div>
                        <div class="video-desc"><strong>Kundi:</strong> ${vid.kundi} • Inacheza Live kwenye mtandao wa m2.</div>
                        
                        <div class="player-box" id="player-box-${vid.id}">
                            <video id="video-${vid.id}" controls></video>
                        </div>

                        <div class="interaction-bar">
                            <span>👍 420 Likes</span>
                            <span style="margin-left: auto;">👁️ m2 Streaming Engine</span>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
